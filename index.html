<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STYLE ME AI V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px}.logo{text-align:center;font-size:30px;font-weight:800;letter-spacing:2px;margin:8px 0 22px}.card{background:#15181d;border:1px solid #292e36;border-radius:18px;padding:16px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}p{color:#aeb5bf;font-size:13px;line-height:1.6}input[type=file]{display:none}.upload{display:block;border:1px dashed #59616d;border-radius:14px;padding:22px;text-align:center;color:#cbd2dc;cursor:pointer}.preview{width:100%;max-height:430px;object-fit:contain;border-radius:14px;margin-top:12px;background:#090a0c;display:none}.btn{width:100%;border:0;border-radius:13px;padding:14px;margin-top:12px;font-size:15px;font-weight:700;cursor:pointer;background:#fff;color:#0b0d10}.btn:disabled{opacity:.45}.status{font-size:13px;color:#aeb5bf;margin-top:10px;min-height:20px}textarea{width:100%;min-height:260px;background:#0d1014;color:#eef1f5;border:1px solid #303640;border-radius:13px;padding:13px;line-height:1.6;resize:vertical;direction:ltr;text-align:left}.result{width:100%;border-radius:14px;margin-top:12px;display:none}.download{display:block;text-align:center;margin-top:12px;color:#fff;text-decoration:none;padding:12px;border:1px solid #3a414b;border-radius:12px}.hidden{display:none}
</style>
</head>
<body>
<main>
<div class="logo">STYLE ME AI V2</div>
<section class="card">
<h2>1. الصورة المرجعية</h2><p>ارفع الصورة التي تريد تحليل أسلوبها.</p>
<label class="upload" for="ref">اختر الصورة المرجعية</label><input id="ref" type="file" accept="image/*">
<img id="refPreview" class="preview"><button id="analyze" class="btn" disabled>تحليل الصورة وإنشاء البرومبت</button><div id="analyzeStatus" class="status"></div>
</section>
<section class="card">
<h2>2. البرومبت</h2><textarea id="prompt" placeholder="سيظهر هنا البرومبت الإنجليزي التفصيلي ويمكنك تعديله قبل التوليد..."></textarea>
</section>
<section class="card">
<h2>3. صورتك الشخصية</h2><p>ارفع الصورة التي تريد الحفاظ على هويتك منها.</p>
<label class="upload" for="me">اختر صورتك</label><input id="me" type="file" accept="image/*">
<img id="mePreview" class="preview"><button id="generate" class="btn" disabled>إنشاء صورتي</button><div id="generateStatus" class="status"></div>
<img id="result" class="result"><a id="download" class="download hidden" download="style-me-ai-v2.png">تحميل الصورة</a>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let refData="",meData="";
async function compress(file){const img=new Image(),url=URL.createObjectURL(file);await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url});const max=1400,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL("image/jpeg",.86)}
$("ref").onchange=async e=>{if(!e.target.files[0])return;refData=await compress(e.target.files[0]);$("refPreview").src=refData;$("refPreview").style.display="block";$("analyze").disabled=false};
$("me").onchange=async e=>{if(!e.target.files[0])return;meData=await compress(e.target.files[0]);$("mePreview").src=meData;$("mePreview").style.display="block";$("generate").disabled=!(refData&&$("prompt").value.trim())};
$("prompt").oninput=()=>{$("generate").disabled=!(refData&&meData&&$("prompt").value.trim())};
$("analyze").onclick=async()=>{ $("analyze").disabled=true;$("analyzeStatus").textContent="جاري تحليل الصورة...";try{const r=await fetch("/.netlify/functions/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"analyze",referenceImage:refData})});const d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");$("prompt").value=d.prompt||"";$("generate").disabled=!(refData&&meData&&$("prompt").value.trim());$("analyzeStatus").textContent="تم إنشاء البرومبت."}catch(e){$("analyzeStatus").textContent=e.message}$("analyze").disabled=false};
$("generate").onclick=async()=>{ $("generate").disabled=true;$("generateStatus").textContent="جاري إنشاء الصورة...";$("result").style.display="none";$("download").classList.add("hidden");try{const r=await fetch("/.netlify/functions/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"generate",referenceImage:refData,identityImage:meData,prompt:$("prompt").value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");$("result").src=d.url;$("result").style.display="block";$("download").href=d.url;$("download").classList.remove("hidden");$("generateStatus").textContent="تم إنشاء الصورة بنجاح."}catch(e){$("generateStatus").textContent=e.message}$("generate").disabled=false};
</script></body></html>
