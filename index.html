<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>STYLE ME AI V2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f5f7;font-family:Arial,sans-serif}main{max-width:680px;margin:auto;padding:18px 14px 40px}h1{text-align:center;font-size:27px;margin:8px 0 4px;letter-spacing:1px}.sub{text-align:center;color:#9ba1ad;font-size:13px;margin-bottom:22px}.card{background:#12151c;border:1px solid #252a35;border-radius:18px;padding:16px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}.hint{color:#9ba1ad;font-size:12px;line-height:1.6;margin:0 0 12px}input[type=file]{width:100%;padding:12px;background:#0e1117;border:1px dashed #3a404d;border-radius:12px;color:#ddd}button{width:100%;border:0;border-radius:12px;padding:13px;margin-top:12px;background:#fff;color:#111;font-weight:700;font-size:15px}button:disabled{opacity:.45}textarea{width:100%;min-height:210px;background:#0e1117;color:#eee;border:1px solid #303643;border-radius:12px;padding:12px;direction:ltr;text-align:left;line-height:1.5;resize:vertical}.preview{display:block;max-width:100%;max-height:360px;margin:12px auto;border-radius:12px;object-fit:contain}.status{font-size:13px;color:#b8bec9;line-height:1.6;margin-top:10px;white-space:pre-wrap}.result img{width:100%;border-radius:14px;margin-top:12px}a.download{display:block;text-align:center;text-decoration:none;background:#1e2430;color:#fff;border-radius:12px;padding:12px;margin-top:10px}</style></head>
<body><main><h1>STYLE ME AI</h1><div class="sub">تحليل الصورة وتحويل أسلوبها إلى صورة جديدة</div>
<section class="card"><h2>1. الصورة المرجعية</h2><p class="hint">ارفع صورة الأسلوب أو الوضعية أو الملابس التي تريد تحليلها.</p><input id="ref" type="file" accept="image/*"><img id="refPreview" class="preview" hidden><button id="analyze">تحليل الصورة وإنشاء البرومبت</button><div id="analyzeStatus" class="status"></div></section>
<section class="card"><h2>2. البرومبت</h2><p class="hint">يمكنك تعديل البرومبت الإنجليزي قبل توليد الصورة.</p><textarea id="prompt" placeholder="سيظهر البرومبت هنا بعد تحليل الصورة..."></textarea></section>
<section class="card"><h2>3. صورتك الشخصية</h2><p class="hint">ارفع صورتك التي تريد الحفاظ على هويتك وملامحها.</p><input id="identity" type="file" accept="image/*"><img id="idPreview" class="preview" hidden><button id="generate">إنشاء الصورة</button><div id="genStatus" class="status"></div><div id="result" class="result"></div></section></main>
<script>
const $=id=>document.getElementById(id);let refData="";
async function compress(file){const img=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u});const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);let q=.82,out=c.toDataURL("image/jpeg",q);while(out.length>320000&&q>.45){q-=.07;out=c.toDataURL("image/jpeg",q)}return out}
function preview(input,img){input.addEventListener("change",()=>{if(!input.files[0])return;img.src=URL.createObjectURL(input.files[0]);img.hidden=false})}preview($("ref"),$("refPreview"));preview($("identity"),$("idPreview"));
$("analyze").onclick=async()=>{if(!$("ref").files[0])return $("analyzeStatus").textContent="اختر الصورة المرجعية أولاً.";$("analyze").disabled=true;$("analyzeStatus").textContent="جارٍ تحليل الصورة...";try{refData=await compress($("ref").files[0]);const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"analyze",referenceImage:refData})});const d=await r.json();if(!r.ok)throw new Error(d.error||"فشل التحليل");$("prompt").value=d.prompt||"";$("analyzeStatus").textContent="تم إنشاء البرومبت بنجاح."}catch(e){$("analyzeStatus").textContent="خطأ: "+e.message}finally{$("analyze").disabled=false}};
$("generate").onclick=async()=>{if(!$("ref").files[0])return $("genStatus").textContent="ارفع الصورة المرجعية أولاً.";if(!$("identity").files[0])return $("genStatus").textContent="ارفع صورتك الشخصية أولاً.";if(!$("prompt").value.trim())return $("genStatus").textContent="أنشئ البرومبت أولاً.";$("generate").disabled=true;$("genStatus").textContent="جارٍ إرسال الصور إلى Seedream...";$("result").innerHTML="";try{if(!refData)refData=await compress($("ref").files[0]);const idData=await compress($("identity").files[0]);const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"generate",referenceImage:refData,identityImage:idData,prompt:$("prompt").value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||"فشل بدء التوليد");if(d.url)return showResult(d.url);if(!d.id)throw new Error("لم يتم الحصول على رقم المهمة");$("genStatus").textContent="تم بدء التوليد. انتظر...";for(let i=0;i<48;i++){await new Promise(r=>setTimeout(r,5000));const s=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"status",id:d.id})});const x=await s.json();if(x.url)return showResult(x.url);if(x.status==="failed"||x.status==="canceled")throw new Error(x.error||"فشل توليد الصورة");$("genStatus").textContent="جارٍ التوليد... "+((i+1)*5)+" ثانية"}throw new Error("انتهت مهلة الانتظار. يمكنك المحاولة مرة أخرى.")}catch(e){$("genStatus").textContent="خطأ: "+e.message}finally{$("generate").disabled=false}};
function showResult(url){$("genStatus").textContent="تم إنشاء الصورة.";$("result").innerHTML='<img src="'+url+'" alt="Generated image"><a class="download" href="'+url+'" target="_blank" download="style-me-ai-result.png">فتح / تحميل الصورة</a>'}
</script></body></html>
